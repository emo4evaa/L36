<!DOCTYPE html>
<html>
    <title>Navbar</title>
    <head>
      <style>
          body {
            margin: 0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
          }
          .topnav {
            overflow: hidden;
            background-color: orchid;
          }
          .topnav a {
            float: left;
            color: rgb(108, 2, 118);
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
          }
          .topnav a:hover {
            background-color: #e090e2;
            color: rgb(188, 56, 188);
          }
      </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#home">Home</a>
            <a href="#">About Us</a>
            <a href="#">Gallery</a>
            <a href="#">Contact Us</a>
        </div>
    </body>
</html>
